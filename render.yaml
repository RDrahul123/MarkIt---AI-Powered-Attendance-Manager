services:
  - type: web
    name: attendance-manager-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.main seed; uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: attendance-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
        value: "https://attendance-frontend.onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.0"

  - type: web
    name: attendance-manager-frontend
    runtime: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: NODE_VERSION
        value: "20"

databases:
  - name: attendance-db
    plan: free
    databaseName: attendance
    user: attendance_user
